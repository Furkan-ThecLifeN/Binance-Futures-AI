services:

  db:
    image: timescale/timescaledb:2.29.1-pg16
    container_name: futures_ai_db

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  redis:
    image: redis:8.10.0-alpine
    container_name: futures_ai_redis

    restart: unless-stopped

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: futures_ai_backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      ENVIRONMENT: ${ENVIRONMENT}

      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}

      DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      REDIS_URL: >-
        redis://redis:6379/${REDIS_DB}

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./backend/app:/app/app

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload"
      ]

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  frontend:
    image: node:22-alpine
    container_name: futures_ai_frontend

    restart: unless-stopped

    working_dir: /app

    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      CHOKIDAR_USEPOLLING: "true"

    ports:
      - "127.0.0.1:5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    command:
      [
        "sh",
        "-c",
        "npm ci && npm run dev -- --host 0.0.0.0"
      ]

    depends_on:
      backend:
        condition: service_healthy


volumes:

  postgres_data:

  redis_data:

  frontend_node_modules: